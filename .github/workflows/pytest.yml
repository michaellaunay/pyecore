name: Python package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        mode: [source, wheel]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare tools
        run: python -m pip install build pytest
      - name: Install source
        if: matrix.mode == 'source'
        run: python -m pip install -e '.[test]'
      - name: Build sdist then wheel and install outside checkout
        if: matrix.mode == 'wheel'
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/pyecore-wheel"
          "$RUNNER_TEMP/pyecore-wheel/bin/python" -m pip install pytest dist/*.whl
      - name: Test source
        if: matrix.mode == 'source'
        run: python -I .github/scripts/test-installed.py "$GITHUB_WORKSPACE" source
      - name: Test installed wheel
        if: matrix.mode == 'wheel'
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pyecore-wheel/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/test-installed.py" "$GITHUB_WORKSPACE" wheel
